blank_issues_enabled: true
contact_links:
  - name: Problem with the browser extension or desktop app
    url: https://github.com/multiwarden/clients/issues/new/choose
    about: Report it in the multiwarden/clients repository.
  - name: Problem with the Android app
    url: https://github.com/multiwarden/android/issues/new/choose
